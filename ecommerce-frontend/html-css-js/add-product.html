<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shop — Add Product</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css" />
<link rel="stylesheet" href="add-product.css" />
</head>
<body>

  <nav class="top-nav">
    <div class="top-nav__inner">
      <div class="top-nav__brand">Simple<span>Shop</span></div>
      <div class="top-nav__links">
        <a href="product-list.html" class="top-nav__link">All Products</a>
        <a href="add-product.html" class="top-nav__link is-active">Add Product</a>
      </div>
    </div>
  </nav>

  <main class="page-shell">

    <div class="form-wrap">
      <h1>Add a Product</h1>
      <p class="form-subtitle">It'll appear in the catalog right away.</p>

      <div id="banner" class="banner banner-error"></div>

      <form id="productForm" novalidate>
        <div class="field">
          <label for="name">Product name</label>
          <input type="text" id="name" name="name" placeholder="e.g. Ceramic Mug" autocomplete="off" />
          <div class="field-error" id="nameError"></div>
        </div>

        <div class="field">
          <label for="price">Price (USD)</label>
          <input type="number" id="price" name="price" placeholder="e.g. 18.00" step="0.01" min="0" />
          <div class="field-error" id="priceError"></div>
        </div>

        <div class="form-actions">
          <a href="product-list.html" class="btn btn-secondary">Cancel</a>
          <button type="submit" class="btn btn-primary" id="submitBtn">Add Product</button>
        </div>
      </form>
    </div>

  </main>

  <script src="add-product.js"></script>
</body>
</html>
